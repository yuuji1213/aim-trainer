<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에임 트레이너 (가칭)</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 크로스헤어: 모양은 js/config.js의 CROSSHAIR에서 변경 -->
  <div id="crosshair">
    <span class="ch-line ch-top"></span>
    <span class="ch-line ch-bottom"></span>
    <span class="ch-line ch-left"></span>
    <span class="ch-line ch-right"></span>
    <span class="ch-dot"></span>
  </div>

  <!-- 남은 시간 / 카운트다운 -->
  <div id="timer">60</div>
  <div id="center-msg"></div>

  <!-- 플레이 중 HUD -->
  <div id="hud">
    <div>처치 <span id="hud-kills">0</span></div>
    <div>명중률 <span id="hud-acc">-</span></div>
    <div>헤드샷 <span id="hud-head">-</span></div>
    <div>이동 <span id="hud-speed">0.0</span> m/s · <span id="hud-accurate" class="ok">정확</span></div>
    <div class="dim">마지막 클릭 <span id="hud-click">-</span></div>
  </div>

  <!-- 시작 / 일시정지 / 결과 화면 -->
  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">연습 모드</h1>

      <!-- 결과 (종료 시에만 표시) -->
      <div id="result" class="hidden">
        <div id="new-record" class="hidden">신기록!</div>
        <div class="result-main">
          <div class="big" id="res-kills">0</div>
          <div class="label">처치</div>
        </div>
        <div class="result-grid">
          <div><span class="label">명중률</span><span id="res-acc">-</span></div>
          <div><span class="label">헤드샷률</span><span id="res-head">-</span></div>
          <div><span class="label">평균 처치 시간</span><span id="res-ttk">-</span></div>
          <div><span class="label">발사 / 명중</span><span id="res-shots">-</span></div>
        </div>
      </div>

      <p id="best-line" class="best"></p>

      <label class="row">
        발로란트 감도
        <input id="sens-input" type="number" min="0.01" max="10" step="0.01">
      </label>

      <button id="start-btn">클릭해서 시작</button>
      <p id="lock-hint" class="hint warn"></p>

      <p class="hint">
        60초 동안 표적 3개를 최대한 많이 처치하세요. ESC를 누르면 일시정지됩니다.<br>
        WASD 이동 · Shift 걷기 · 움직이면서 쏘면 부정확 (속도 27.5% 미만이면 정확)<br>
        좌클릭: 짧게 = 1발, 누르고 있기 = 연사 (밴달 · 초당 9.75발 · 무한 탄창)<br>
        데미지: 머리 160 / 몸 40 / 다리 34 · 표적 체력 150
      </p>
      <p class="hint">원시 입력: <span id="raw-status">시작하면 확인</span></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
